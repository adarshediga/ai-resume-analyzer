spring.application.name=ai-resume-analyzer

spring.ai.ollama.base-url= http://localhost:11434
spring.ai.ollama.chat.options.model =llama3.2

server.port = 8080


spring.datasource.url=jdbc:mysql://localhost:3306/ai_resume_analyzer
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

info.app.name=AI Resume Analyzer
info.app.description=AI-powered resume analysis and job matching application
info.app.version=1.0.0
management.endpoint.health.show-details=when-authorized
